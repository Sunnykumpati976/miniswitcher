name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitize: [ OFF, ON ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DMS_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark (1080p60)
        if: matrix.sanitize == 'OFF'
        run: ./build/tools/switch_demo --bench --width 1920 --height 1080

  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make && make test
